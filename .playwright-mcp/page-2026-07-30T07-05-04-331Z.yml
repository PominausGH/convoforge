        - generic [ref=e35]: Why ConvoForge
        - heading "You don't have a knowledge problem. You have a practice problem." [level=2] [ref=e36]
        - paragraph [ref=e37]: You know eye contact matters. You know not to say “um.” In the moment — when your manager asks the question you weren't expecting, or you're pitching on Zoom to someone who hasn't smiled once — the knowledge doesn't show up. The reps do.
      - generic [ref=e38]:
        - generic [ref=e39]:
          - generic [ref=e40]: ⏱
          - heading "5 minutes. Every day. That's the whole ask." [level=3] [ref=e41]
          - paragraph [ref=e42]: No 40-hour courses. No live coaches you need to schedule. One session before your morning coffee, and you're building the muscle memory that shows up in real conversations.
        - generic [ref=e43]:
          - generic [ref=e44]: 🔒
          - heading "Your video never leaves your device." [level=3] [ref=e45]
          - paragraph [ref=e46]: On-device MediaPipe runs body language analysis in your browser. Zero cloud uploads. Zero data brokers. Practise the salary negotiation, the hard feedback — privately.
        - generic [ref=e47]:
          - generic [ref=e48]: 📐
          - heading "A curriculum that goes somewhere." [level=3] [ref=e49]
          - paragraph [ref=e50]: Most feedback tools tell you what you did wrong. ConvoForge gives you a structured path — Carnegie, Radical Candor, NVC — with a clear progression, not random topics.
        - generic [ref=e51]:
